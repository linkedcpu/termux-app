plugins {
    id "com.android.application"
}

ext {
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7"
}

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0"

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.12.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 1002
        versionName "0.118.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\""

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"
        manifestPlaceholders.TERMUX_APP_NAME = "Termux"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid semantic version.")
}

def downloadBootstrap(String arch, String expectedChecksum, String version) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    def localUrl = "src/main/cpp/bootstrap-" + arch + ".zip"
    def file = new File(projectDir, localUrl)
    if (file.exists()) {
        def buffer = new byte[8192]
        def input = new FileInputStream(file)
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) return
        else {
            logger.quiet("Deleting old local file with wrong hash: " + localUrl)
            file.delete()
        }
    }

    def remoteUrl = "https://gh-proxy.org/https://github.com/termux/termux-packages/releases/download/bootstrap-" + version + "/bootstrap-" + arch + ".zip"
    logger.quiet("Downloading " + remoteUrl + " ...")
    file.parentFile.mkdirs()
    def out = new BufferedOutputStream(new FileOutputStream(file))
    def connection = new URL(remoteUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
    out << digestStream
    out.close()

    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    if (checksum != expectedChecksum) {
        file.delete()
        throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
    }
}

clean {
    doLast {
        def tree = fileTree(new File(projectDir, 'src/main/cpp'))
        tree.include 'bootstrap-*.zip'
        tree.each { it.delete() }
    }
}

task downloadBootstraps() {
    doLast {
        def packageVariant = project.ext.packageVariant
        if (packageVariant == "apt-android-7") {
            def version = "2026.09.20-r1" + "%2B" + "apt.android-7"
            downloadBootstrap("aarch64", "65ba578133ea2f4e5cc07234568815397cf9e1236b5da8c06ce6753cf036cc69", version)
            downloadBootstrap("arm", "1c953b1d808c45fd578b7a3b4ba4d6b6f54329a7f6db57dceeab55fe997102e8", version)
            downloadBootstrap("i686", "db0c868c88b8d814e71b7e2d60438c836b903585140f40046d885ce103e789fe", version)
            downloadBootstrap("x86_64", "2d23d45c1a9e72dda2172895c218334473a2d1560e724f4b88323e56e80736ff", version)
        } else if (packageVariant == "apt-android-5") {
            def version = "2022.04.28-r6" + "+" + packageVariant
            downloadBootstrap("aarch64", "913609d439415c828c5640be1b0561467e539cb1c7080662decaaca2fb4820e7", version)
            downloadBootstrap("arm", "26bfb45304c946170db69108e5eb6e3641aad751406ce106c80df80cad2eccf8", version)
            downloadBootstrap("i686", "46dcfeb5eef67ba765498db9fe4c50dc4690805139aa0dd141a9d8ee0693cd27", version)
            downloadBootstrap("x86_64", "615b590679ee6cd885b7fd2ff9473c845e920f9b422f790bb158c63fe42b8481", version)
        } else {
            throw new GradleException("Unsupported TERMUX_PACKAGE_VARIANT \"" + packageVariant + "\"")
        }
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.javaCompileProvider.get().dependsOn(downloadBootstraps)
    }
}



// ==================== Bergamot 完整构建链 ====================

// ---------- 1. 编译二进制 ----------
task buildBergamot(type: Exec) {
    group = "bergamot"
    description = "Build bergamot-translator"
 //   workingDir file("src/main/cpp/bergamot-translator")
    def termuxPrefix = System.getenv("PREFIX")
            ?: "/data/data/com.termux/files/usr"
    commandLine "$termuxPrefix/bin/bash","${project.rootDir}/build_bergamot.sh"

  //  inputs.dir("src/main/cpp/bergamot-translator")
 //:w   outputs.files(
      //  "src/main/cpp/bergamot-translator/build/app/bergamot",
     //   "src/main/cpp/bergamot-translator/build/app/bergamot.sha256"
  //  )
}

// ---------- 2. 拷贝二进制 + hash 到 assets ----------
task copyBergamot {
    group = "bergamot"
    description = "Copies bergamot binary + sha256 into assets/bergamot/bin/"
    dependsOn buildBergamot

    doLast {
        def destDir = file("src/main/assets/bergamot/bin")
        destDir.mkdirs()

        // 拷 binary
        def binSrc = file("src/main/cpp/bergamot-translator/build/app/bergamot")
        if (!binSrc.exists()) {
            throw new GradleException("bergamot binary not found: ${binSrc}")
        }
        def binDest = new File(destDir, "bergamot")
        binDest.withOutputStream { os ->
            binSrc.withInputStream { is ->
                def buf = new byte[8192]; int n
                while ((n = is.read(buf)) != -1) os.write(buf, 0, n)
            }
        }
        binDest.setExecutable(true, false)
        println "  ✓ bergamot → assets/bergamot/bin/bergamot (${(binDest.length() / 1024 / 1024).intValue()} MB)"

        // 拷 sha256（带 fallback）
        def shaSrc = file("src/main/cpp/bergamot-translator/build/app/bergamot.sha256")
        def shaDest = new File(destDir, "bergamot.sha256")
        if (shaSrc.exists()) {
            shaDest.withOutputStream { os ->
                shaSrc.withInputStream { is ->
                    def buf = new byte[8192]; int n
                    while ((n = is.read(buf)) != -1) os.write(buf, 0, n)
                }
            }
            println "  ✓ bergamot.sha256 copied"
        } else {
            println "  ⚠ sha256 not found, computing locally..."
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            binDest.withInputStream { is ->
                def buf = new byte[8192]; int n
                while ((n = is.read(buf)) != -1) digest.update(buf, 0, n)
            }
            shaDest.text = digest.digest().collect { String.format("%02x", it) }.join("")
            println "  ✓ bergamot.sha256 computed locally"
        }
    }
}

// ---------- 3. 下载模型 ----------
task downloadBergamotModels {
    description = "Downloads, verifies, gunzips bergamot models into assets/bergamot/models/"
    group = "bergamot"

    doLast {
        def modelsRoot = file("src/main/assets/bergamot/models")
        modelsRoot.mkdirs()

        def cacheDir = file("${buildDir}/bergamot_models_cache")
        cacheDir.mkdirs()
        def jsonFile = new File(cacheDir, "models.json")
        def lockFile = new File(cacheDir, "models.lock")

        // 1. registry
        if (!jsonFile.exists() || jsonFile.length() < 100) {
            println "  ↓ downloading models.json ..."
            new URL("https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data/db/models.json")
                .withInputStream { is ->
                    jsonFile.withOutputStream { os ->
                        def buf = new byte[8192]; int n
                        while ((n = is.read(buf)) != -1) os.write(buf, 0, n)
                    }
                }
            println "  ✓ models.json (${(jsonFile.length() / 1024).intValue()} KB)"
        } else {
            println "  ✓ models.json (cached)"
        }

        def root = new groovy.json.JsonSlurper().parseText(jsonFile.text)
        def baseUrl = root.baseUrl?.toString()?.replaceAll('/$', '')
        def models = root.models
        if (baseUrl == null || models == null) {
            throw new GradleException("Invalid registry: missing baseUrl or models")
        }

        def oldLock = lockFile.exists() ? new groovy.json.JsonSlurper().parseText(lockFile.text) : [:]
        def targets = ["en-zh": "enzh", "zh-en": "zhen"]
        def newLock = [:]

        targets.each { registryKey, localDir ->
            def entries = models.get(registryKey)
            if (!(entries instanceof List) || entries.isEmpty()) {
                println "  ⚠ '${registryKey}' not found, skipping"
                return
            }

            def selected = entries.find {
                it.architecture?.contains("memory") && it.releaseStatus?.toString()?.contains("Release")
            } ?: entries.find {
                it.architecture == "base" && it.releaseStatus?.toString()?.contains("Release")
            } ?: entries[0]

            println "  📌 ${registryKey}: using '${selected.architecture}' (status: ${selected.releaseStatus ?: 'none'})"

            def files = selected.files
            if (!(files instanceof Map)) return

            def pairDir = new File(modelsRoot, localDir)
            pairDir.mkdirs()
            newLock[localDir] = [:]

            files.each { fileType, fileInfo ->
                def path = fileInfo?.path?.toString()
                if (path == null || path.isEmpty()) return

                def gzFilename = path.replaceAll('.*/', '')
                def rawFilename = gzFilename.replaceAll(/\.gz$/, '')
                def fullUrl = "${baseUrl}/${path}"
                def expectedHash = fileInfo?.uncompressedHash?.toString()

                def target = new File(pairDir, rawFilename)
                def gzTarget = new File(pairDir, gzFilename)
                def oldHash = oldLock.get(localDir)?.get(rawFilename)

                // 跳过判断
                if (target.exists() && target.length() > 0 && oldHash == expectedHash) {
                    println "  ✓ ${localDir}/${rawFilename} (exists, skip)"
                    newLock[localDir][rawFilename] = expectedHash
                    return
                }

                // 删旧
                if (target.exists()) target.delete()
                if (gzTarget.exists()) gzTarget.delete()

                // 下载
                println "  ↓ ${localDir}/${gzFilename} ..."
                def success = false
                for (int attempt = 0; attempt < 3 && !success; attempt++) {
                    try {
                        def conn = new URL(fullUrl).openConnection()
                        conn.setConnectTimeout(15000)
                        conn.setReadTimeout(60000)
                        conn.connect()
                        def code = conn.getResponseCode()
                        if (code != 200) throw new IOException("HTTP ${code}")

                        def os = new FileOutputStream(gzTarget)
                        def is = conn.getInputStream()
                        def buf = new byte[8192]; int n
                        while ((n = is.read(buf)) != -1) os.write(buf, 0, n)
                        is.close(); os.close()

                        if (!verifyGzip(gzTarget)) {
                            gzTarget.delete()
                            throw new IOException("gzip corrupted")
                        }
                        if (expectedHash != null && !verifyUncompressedHash(gzTarget, expectedHash)) {
                            gzTarget.delete()
                            throw new IOException("SHA256 mismatch")
                        }
                        success = true
                        println "  ✓ ${localDir}/${gzFilename} downloaded"
                    } catch (Exception e) {
                        println "  ✗ attempt ${attempt+1}/3: ${e.message}"
                        if (attempt == 2) throw new GradleException("Failed: ${gzFilename}", e)
                        Thread.sleep(3000)
                    }
                }

                // 解压
                println "  ↳ gunzip → ${rawFilename}"
                new FileOutputStream(target).withStream { fos ->
                    new java.util.zip.GZIPInputStream(new FileInputStream(gzTarget)).withStream { gis ->
                        def buf = new byte[8192]; int n
                        while ((n = gis.read(buf)) != -1) fos.write(buf, 0, n)
                    }
                }
                if (expectedHash != null) {
                    def actual = sha256(target)
                    if (actual != expectedHash) {
                        target.delete(); gzTarget.delete()
                        throw new GradleException("Hash mismatch after gunzip: ${rawFilename}")
                    }
                }
                gzTarget.delete()
                newLock[localDir][rawFilename] = expectedHash
                println "  ✓ ${localDir}/${rawFilename} (${(target.length() / 1024 / 1024).intValue()} MB)"
            }

            // 生成 yml
            def yml = ""
            if (localDir == "enzh") {
                yml = """models:
  - model.enzh.intgemm.alphas.bin
vocabs:
  - srcvocab.enzh.spm
  - trgvocab.enzh.spm
shortlist:
  - lex.50.50.enzh.s2t.bin
  - 50
  - 50
beam-size: 1
normalize: 1.0
word-penalty: 0
max-length-break: 128
mini-batch-words: 1024
max-length-factor: 2.0
skip-cost: true
cpu-threads: 4
gemm-precision: int8shiftAlphaAll
workspace: 128
quiet: true
quiet-translation: true
"""
            } else {
                yml = """models:
  - model.zhen.intgemm.alphas.bin
vocabs:
  - vocab.zhen.spm
  - vocab.zhen.spm
shortlist:
  - lex.50.50.zhen.s2t.bin
  - 50
  - 50
beam-size: 1
normalize: 1.0
word-penalty: 0
max-length-break: 128
mini-batch-words: 1024
max-length-factor: 2.0
skip-cost: true
cpu-threads: 4
gemm-precision: int8shiftAlphaAll
workspace: 128
quiet: true
quiet-translation: true
"""
            }
            new File(pairDir, "${localDir}.yml").text = yml
            println "  ✓ ${localDir}/${localDir}.yml generated"
        }

        // 写 lock
        lockFile.text = groovy.json.JsonOutput.prettyPrint(
            groovy.json.JsonOutput.toJson(newLock)
        )
        println "✓ models.lock updated"
        println "✓ Done. Models ready in assets/bergamot/models/"
    }
}

// ---------- 4. 工具函数 ----------
def verifyGzip(File f) {
    if (f.length() < 18) return false
    try {
        def fis = new FileInputStream(f)
        def gis = new java.util.zip.GZIPInputStream(fis)
        def buf = new byte[8192]
        while (gis.read(buf) != -1) {}
        gis.close(); fis.close()
        return true
    } catch (Exception e) { return false }
}

def verifyUncompressedHash(File gzFile, String expectedHash) {
    if (expectedHash == null || expectedHash.isEmpty()) return true
    try {
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        def fis = new FileInputStream(gzFile)
        def gis = new java.util.zip.GZIPInputStream(fis)
        def buf = new byte[8192]; int n
        while ((n = gis.read(buf)) != -1) digest.update(buf, 0, n)
        gis.close(); fis.close()
        def actual = digest.digest().collect { String.format("%02x", it) }.join("")
        return actual.equals(expectedHash)
    } catch (Exception e) { return false }
}

def sha256(File f) {
    def d = java.security.MessageDigest.getInstance("SHA-256")
    f.withInputStream { is ->
        def buf = new byte[8192]; int n
        while ((n = is.read(buf)) != -1) d.update(buf, 0, n)
    }
    return d.digest().collect { String.format("%02x", it) }.join("")
}

// ---------- 5. 依赖链（核心修复：只这一段，干净利落）----------
afterEvaluate {
    android.applicationVariants.all { variant ->
        def mergeTask = tasks.findByName("merge${variant.name.capitalize()}Assets")
        if (mergeTask != null) {
            mergeTask.dependsOn copyBergamot
            mergeTask.dependsOn downloadBergamotModels
        }
    }
}

// ---------- 6. 清理 ----------
task cleanBergamot {
    description = "Removes all bergamot assets (bin + models) and cache"
    doLast {
        delete file("src/main/assets/bergamot")
        delete file("${buildDir}/bergamot_models_cache")
        println "✓ assets/bergamot/ + cache cleared"
    }
}
