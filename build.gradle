buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    afterEvaluate { p ->
        if (p.hasProperty('android')) {
            p.android.buildToolsVersion = "35.0.1" // 换成你已装的
        }
    }
}
